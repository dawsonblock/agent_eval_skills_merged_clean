name: Release Upload Triage

permissions: read-all

on:
    workflow_dispatch:

jobs:
    classify-uploaded-release-artifact:
        name: Classify Uploaded Release Artifact
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Verify release gate naming consistency
              run: |
                  bash scripts/verify_release_gate_policy.sh

            - name: Classify uploaded artifact
              env:
                  RELEASE_ZIP_PATH: agent_eval_skills_merged_clean-pruned-smoke.zip
                  EVIDENCE_ZIP_PATH: agent_eval_skills_merged_clean-smoke-evidence-2026-05-31.zip
              run: |
                  bash scripts/classify_release_upload.sh \
                      --release "$RELEASE_ZIP_PATH" \
                      --evidence "$EVIDENCE_ZIP_PATH" \
                      --json-output .validation_logs/release_upload_triage_verdict.json

            - name: Upload triage verdict artifact
              uses: actions/upload-artifact@v4
              with:
                  name: release-upload-triage-verdict
                  path: .validation_logs/release_upload_triage_verdict.json
                  if-no-files-found: error
                  retention-days: 14
