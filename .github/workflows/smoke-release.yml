name: Smoke Release Proof

on:
    push:
    pull_request:

jobs:
    smoke-release:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.9", "3.10", "3.11", "3.12"]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install ToolForge
              run: |
                  cd ToolForge
                  python -m pip install --upgrade pip
                  python -m pip install -e ".[dev]"

                        - name: Verify smoke profile excludes google_calendar
                            run: |
                                    python - <<'PY'
                                    import json
                                    from pathlib import Path

                                    profile = json.loads(Path('toolathlon-gym-curated/profiles/smoke/mcp_servers.json').read_text(encoding='utf-8'))
                                    servers = profile.get('servers', [])
                                    assert servers == ['rail_12306', 'filesystem'], servers
                                    assert 'google_calendar' not in servers, servers
                                    print('Smoke profile target list verified:', servers)
                                    PY

            - name: Prove smoke release
              run: |
                  bash scripts/prove_smoke_release.sh

            - name: Upload validation logs
              uses: actions/upload-artifact@v4
              with:
                  name: validation-logs-${{ matrix.python-version }}
                  path: .validation_logs
