name: Smoke Release Proof

on:
    push:
    pull_request:

jobs:
    smoke-release:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.9", "3.10", "3.11", "3.12"]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install ToolForge
              run: |
                  cd ToolForge
                  python -m pip install --upgrade pip
                  python -m pip install -e ".[dev]"

                        - name: Build Google Calendar MCP artifact
                            run: |
                                    cd toolathlon-gym-curated/local_servers/Calendar-Autoauth-MCP-Server
                                    npm ci --ignore-scripts
                                    npm run build

            - name: Prove smoke release
              run: |
                  bash scripts/prove_smoke_release.sh

            - name: Upload validation logs
              uses: actions/upload-artifact@v4
              with:
                  name: validation-logs-${{ matrix.python-version }}
                  path: .validation_logs
