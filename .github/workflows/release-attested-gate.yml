name: Release Attested Pair Gate

permissions: read-all

on:
    workflow_dispatch:

jobs:
    verify-attested-pair:
        name: Verify Canonical Attested Pair
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Verify release gate naming consistency
              run: |
                  bash scripts/verify_release_gate_policy.sh

            - name: Verify release+evidence pair
              env:
                  RELEASE_ZIP_PATH: agent_eval_skills_merged_clean-pruned-smoke.zip
                  EVIDENCE_ZIP_PATH: agent_eval_skills_merged_clean-smoke-evidence-2026-05-27.zip
              run: |
                  bash scripts/verify_release_pair.sh

            - name: Verify evidence bundle policy values
              env:
                  EVIDENCE_ZIP_PATH: agent_eval_skills_merged_clean-smoke-evidence-2026-05-27.zip
              run: |
                  bash scripts/verify_evidence_bundle.sh --evidence "$EVIDENCE_ZIP_PATH"

            - name: Upload verified pair (gate proof)
              uses: actions/upload-artifact@v4
              with:
                  name: attested-release-pair
                  path: |
                      agent_eval_skills_merged_clean-pruned-smoke.zip
                      agent_eval_skills_merged_clean-smoke-evidence-2026-05-27.zip
                  if-no-files-found: error
                  retention-days: 14
