name: Validate Workspace

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]
    workflow_dispatch:
    schedule:
        - cron: "30 6 * * 1"

env:
    TOOLATHLON_PROFILE: smoke

jobs:
    toolforge:
        name: ToolForge Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install ToolForge dev dependencies
              working-directory: ./ToolForge
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e ".[dev]"

            - name: Run ToolForge doctor
              working-directory: ./ToolForge
              run: |
                  PYTHONPATH=. python -m apps.cli.toolforge_cli.main doctor

            - name: Run ToolForge tests
              working-directory: ./ToolForge
              run: |
                  PYTHONPATH=. pytest -q

    agent-skills:
        name: Agent Skills Validation
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install agent-skills dependencies
              working-directory: ./agent-skills-curated
              run: |
                  npm install || true

            - name: Validate Agent Skills
              working-directory: ./agent-skills-curated
              run: |
                  node bin/cli.js eval --json

    toolathlon-preflight:
        name: Toolathlon MCP Preflight
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install PyYAML
              run: |
                  python -m pip install pyyaml

            - name: Build required MCP artifacts
              working-directory: ./toolathlon-gym-curated
              run: |
                  TOOLATHLON_PROFILE=smoke bash scripts/build_required_mcp_artifacts.sh

            - name: Run MCP preflight validation
              working-directory: ./toolathlon-gym-curated
              run: |
                  TOOLATHLON_PROFILE=smoke python scripts/preflight_mcp_paths.py

    unified-validation:
        name: Unified Workspace Validation
        runs-on: ubuntu-latest
        needs: [toolforge, agent-skills, toolathlon-preflight]
        if: success()
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Run unified validation script
              run: |
                  TOOLATHLON_PROFILE=smoke bash scripts/validate_workspace.sh

    full-profile-validation:
        name: Full Profile Validation (Experimental)
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        continue-on-error: true
        timeout-minutes: 240
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Run full profile validation (non-blocking)
              run: |
                  TOOLATHLON_PROFILE=full RUN_INTEGRATION=1 RUN_DOCKER=0 bash scripts/validate_workspace.sh
