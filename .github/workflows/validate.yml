name: Validate Workspace

permissions: read-all

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]
    workflow_dispatch:
    schedule:
        - cron: 30 6 * * 1

env:
    TOOLATHLON_PROFILE: smoke

jobs:
    release-gate-policy-consistency:
        name: Release Gate Policy Consistency
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Verify release gate naming consistency
              run: |
                  bash scripts/verify_release_gate_policy.sh

    toolforge:
        name: ToolForge Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                                    python-version: "3.12"

            - name: Install ToolForge dev dependencies
              working-directory: ./ToolForge
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e ".[dev]"

            - name: Run ToolForge doctor
              working-directory: ./ToolForge
              run: |
                  PYTHONPATH=. python -m apps.cli.toolforge_cli.main doctor

            - name: Run ToolForge tests
              working-directory: ./ToolForge
              run: |
                  PYTHONPATH=. pytest -q

    agent-skills:
        name: Agent Skills Validation
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install agent-skills dependencies
              working-directory: ./agent-skills-curated
              run: |
                  npm install || true

            - name: Validate Agent Skills
              working-directory: ./agent-skills-curated
              run: |
                  node bin/cli.js eval --json

    toolathlon-preflight:
        name: Toolathlon MCP Preflight
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                                    python-version: "3.12"

            - name: Install PyYAML
              run: |
                  python -m pip install pyyaml

            - name: Build required MCP artifacts
              working-directory: ./toolathlon-gym-curated
              run: |
                  TOOLATHLON_PROFILE=smoke bash scripts/build_required_mcp_artifacts.sh

            - name: Run MCP preflight validation
              working-directory: ./toolathlon-gym-curated
              run: |
                  TOOLATHLON_PROFILE=smoke python scripts/preflight_mcp_paths.py

    unified-validation:
        name: Unified Workspace Validation
        runs-on: ubuntu-latest
        needs:
            [
                release-gate-policy-consistency,
                toolforge,
                agent-skills,
                toolathlon-preflight,
            ]
        if: success()
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Clean local cache artifacts
              run: |
                  find . -name '._*' -delete
                  find . -name '.DS_Store' -delete
                  rm -rf .pytest_cache .mypy_cache .ruff_cache
                  find . -type d -name '__pycache__' -prune -exec rm -rf {} +
                  find . -name '*.pyc' -delete

            - name: Install ToolForge dev dependencies
              working-directory: ./ToolForge
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e ".[dev]"

            - name: Build Google Calendar MCP artifact
              working-directory: ./toolathlon-gym-curated/local_servers/Calendar-Autoauth-MCP-Server
              run: |
                  npm ci --ignore-scripts
                  npm run build

            - name: Run smoke preflight check
              run: |
                  bash scripts/check_toolathlon_smoke_profile.sh

            - name: Compile Python modules
              run: |
                  python -m compileall -q ToolForge/packages ToolForge/apps ToolForge/skillforge_ai ToolForge/tests tests scripts

            - name: Run ToolForge targeted release tests
              working-directory: ./ToolForge
              run: |
                  python -m pytest \
                    tests/test_tool_spec.py \
                    tests/test_path_safety.py \
                    tests/test_safety_analyzer.py \
                    tests/test_validators.py \
                    tests/test_registry.py \
                    tests/test_dangerous_tool_specs.py \
                    tests/test_security_policy_expanded.py \
                    tests/test_skillforge_lifecycle.py \
                    tests/test_skillforge_ai \
                    tests/test_local_deepseek_demo_adapter.py \
                    tests/test_local_deepseek_demo_api.py \
                    -q

            - name: Run Agent Skills eval
              run: |
                  node agent-skills-curated/bin/cli.js eval

            - name: Run unified validation script
              run: |
                  TOOLATHLON_PROFILE=smoke ENFORCE_RC_SMOKE_PROFILE=1 bash scripts/validate_workspace.sh

            - name: Strict absolute path leak check
              run: |
                  python scripts/check_no_absolute_local_paths.py --strict

            - name: Build SkillForge candidate bundle
              run: |
                  bash scripts/build_skillforge_ai_candidate_zip.sh

            - name: Verify SkillForge baseline gate
              run: |
                  bash scripts/verify_skillforge_baseline_gate.sh --allow-dirty

            - name: Regenerate release manifest
              run: |
                  python scripts/generate_release_manifest.py

            - name: Assert release manifest has zero missing files
              run: |
                  python - <<'PY'
                  import json
                  from pathlib import Path

                  root = Path('.')
                  manifest = json.loads(Path('RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
                  missing = [
                      item['path']
                      for item in manifest.get('files', [])
                      if not (root / item['path']).exists()
                  ]
                  if missing:
                      raise SystemExit('Manifest missing files: ' + ', '.join(missing[:20]))
                  print('Release manifest missing-file check passed.')
                  PY

            - name: Verify evidence bundle policy
              run: |
                  bash scripts/verify_evidence_bundle.sh --evidence dist/release/agent_eval_skills_merged_clean-smoke-evidence-2026-05-22.zip

            - name: Build canonical pruned smoke ZIP
              run: |
                  bash scripts/build_pruned_smoke_release.sh --canonical

            - name: Verify canonical release pair
              run: |
                  bash scripts/verify_canonical_release_pair.sh

            - name: Run root release policy tests
              run: |
                  PYTHONPATH=ToolForge python -m pytest tests/test_release_identity.py tests/test_claims_policy.py -q

            - name: Assert smoke profile evidence
              run: |
                  python - <<'PY'
                  import json
                  from pathlib import Path

                  root = Path('.validation_logs')
                  required = {
                      'validation_summary.json': ('capabilities', 'toolathlon_profile'),
                      'toolathlon_artifact_build_summary.json': ('profile',),
                      'toolathlon_mcp_smoke_summary.json': ('profile',),
                      'toolathlon_preflight_summary.json': ('profile',),
                  }

                  mismatches = []
                  missing = []

                  for filename, key_path in required.items():
                      path = root / filename
                      if not path.exists():
                          missing.append(filename)
                          continue
                      data = json.loads(path.read_text(encoding='utf-8'))
                      value = data
                      for key in key_path:
                          value = value.get(key) if isinstance(value, dict) else None
                      if value != 'smoke':
                          dotted = '.'.join(key_path)
                          mismatches.append(f"{filename}:{dotted}={value!r}")

                  if missing or mismatches:
                      lines = []
                      if missing:
                          lines.append('missing files: ' + ', '.join(missing))
                      if mismatches:
                          lines.append('profile mismatches: ' + ', '.join(mismatches))
                      raise SystemExit('Smoke evidence assertion failed: ' + '; '.join(lines))

                  print('Smoke evidence assertion passed.')
                  PY

            - name: Upload validation logs
              uses: actions/upload-artifact@v4
              with:
                  name: validation-logs-smoke
                  path: .validation_logs
                  if-no-files-found: error
                  retention-days: 7

            - name: Upload release artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: dist-release-smoke
                  path: dist/release
                  if-no-files-found: error
                  retention-days: 7

    release-policy-drift:
        name: Validate Release Policy Drift
        runs-on: ubuntu-latest
        needs: [unified-validation]
        if: success()
        steps:
            - uses: actions/checkout@v4

            - name: Verify release policy constants and evidence drift
              run: |
                  bash scripts/validate_release_policy_drift.sh --require-validation-logs

    release-zip-hygiene:
        name: Release ZIP Hygiene
        runs-on: ubuntu-latest
        needs: [unified-validation, release-policy-drift]
        if: success()
        steps:
            - uses: actions/checkout@v4

            - name: Build and validate release ZIP
              run: |
                  RELEASE_ZIP_OUTPUT=dist/ci-release.zip bash scripts/create_release_zip.sh

            - name: Confirm release ZIP exists
              run: |
                  test -f dist/ci-release.zip
                  zipinfo -1 dist/ci-release.zip | wc -l

            - name: Upload release ZIP artifact (hygiene proof)
              uses: actions/upload-artifact@v4
              with:
                  name: ci-release-zip
                  path: dist/ci-release.zip
                  if-no-files-found: error
                  retention-days: 7

    attested-pair-verification:
        name: Verify Canonical Attested Pair
        runs-on: ubuntu-latest
        needs: [release-zip-hygiene]
        if: success()
        steps:
            - uses: actions/checkout@v4

            - name: Verify canonical release+evidence pair
              env:
                  RELEASE_ZIP_PATH: agent_eval_skills_merged_clean-pruned-smoke.zip
                  EVIDENCE_ZIP_PATH: agent_eval_skills_merged_clean-smoke-evidence-2026-05-22.zip
              run: |
                  bash scripts/verify_release_pair.sh

            - name: Verify evidence bundle policy values
              env:
                  EVIDENCE_ZIP_PATH: agent_eval_skills_merged_clean-smoke-evidence-2026-05-22.zip
              run: |
                  bash scripts/verify_evidence_bundle.sh --evidence "$EVIDENCE_ZIP_PATH"

    upload-triage-verification:
        name: Classify Uploaded Release Artifact
        runs-on: ubuntu-latest
        needs: [attested-pair-verification]
        if: success()
        steps:
            - uses: actions/checkout@v4

            - name: Classify canonical release upload and emit triage verdict
              env:
                  RELEASE_ZIP_PATH: agent_eval_skills_merged_clean-pruned-smoke.zip
                  EVIDENCE_ZIP_PATH: agent_eval_skills_merged_clean-smoke-evidence-2026-05-22.zip
              run: |
                  bash scripts/classify_release_upload.sh \
                    --release "$RELEASE_ZIP_PATH" \
                    --evidence "$EVIDENCE_ZIP_PATH" \
                    --json-output .validation_logs/validate_workflow_upload_triage_verdict.json

            - name: Upload upload-triage verdict artifact
              uses: actions/upload-artifact@v4
              with:
                  name: validate-upload-triage-verdict
                  path: .validation_logs/validate_workflow_upload_triage_verdict.json
                  if-no-files-found: error
                  retention-days: 7

    full-profile-validation:
        name: Full MCP Profile Validation (Experimental)
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        continue-on-error: true
        timeout-minutes: 240
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                                    python-version: "3.12"

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Run full profile validation (non-blocking)
              run: |
                  TOOLATHLON_PROFILE=full RUN_INTEGRATION=1 RUN_DOCKER=0 bash scripts/validate_workspace.sh

            - name: Assert full profile evidence (non-blocking job)
              run: |
                  python - <<'PY'
                  import json
                  from pathlib import Path

                  root = Path('.validation_logs')
                  required = {
                      'validation_summary.json': ('capabilities', 'toolathlon_profile'),
                      'toolathlon_artifact_build_summary.json': ('profile',),
                      'toolathlon_mcp_smoke_summary.json': ('profile',),
                      'toolathlon_preflight_summary.json': ('profile',),
                  }

                  mismatches = []
                  missing = []

                  for filename, key_path in required.items():
                      path = root / filename
                      if not path.exists():
                          missing.append(filename)
                          continue
                      data = json.loads(path.read_text(encoding='utf-8'))
                      value = data
                      for key in key_path:
                          value = value.get(key) if isinstance(value, dict) else None
                      if value != 'full':
                          dotted = '.'.join(key_path)
                          mismatches.append(f"{filename}:{dotted}={value!r}")

                  if missing or mismatches:
                      lines = []
                      if missing:
                          lines.append('missing files: ' + ', '.join(missing))
                      if mismatches:
                          lines.append('profile mismatches: ' + ', '.join(mismatches))
                      raise SystemExit('Full evidence assertion failed: ' + '; '.join(lines))

                  print('Full evidence assertion passed.')
                  PY
