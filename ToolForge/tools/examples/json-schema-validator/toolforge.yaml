name: JSON Schema Validator
slug: json-schema-validator
version: "0.1.0"
description: Validates JSON files against a JSON Schema and reports a structured result.
long_description: |
  json-schema-validator reads a JSON data file and a JSON Schema from disk,
  validates the data against the schema, and returns a structured JSON report.
tags: [json, validation, schema, lint]
author: ToolForge
language: python
entry_point: tool.py
dependencies:
  - "python>=3.12"
  - "jsonschema>=4.0"
parameters:
  - name: data_path
    type: string
    description: Path to the JSON data file to validate.
    required: true
  - name: schema_path
    type: string
    description: Path to the JSON Schema file.
    required: true
output:
  type: object
  description: JSON report with valid boolean and list of errors.
security:
  requires_filesystem: true
  requires_network: false
  allowed_read_paths:
    - ./examples/**
    - ./inputs/**
  allowed_write_paths: []
  allowed_extensions:
    - .json
  max_file_size_mb: 50
  max_memory_mb: 256
sandbox_level: 1
mcp:
  enabled: true
  transport: stdio
skill:
  enabled: true
  category: coding-agents-and-ides
eval:
  enabled: true
  baseline_pass_rate: 0.9
  criteria:
    - name: no_error
      type: no_error
      description: Tool runs without errors
      weight: 1.0
    - name: valid_json_output
      type: contains
      description: Output contains the valid key
      weight: 0.5
  cases:
    - id: case-01-valid
      description: Valid JSON against its schema
      inputs:
        data_path: examples/data_valid.json
        schema_path: examples/schema.json
      expected_success: true
      expected_output_contains: '"valid": true'
      expected_files:
        - path: outputs/validation_report.json
          should_exist: true
      tags: [smoke]
    - id: case-02-invalid
      description: Invalid JSON missing required field
      inputs:
        data_path: examples/data_invalid.json
        schema_path: examples/schema.json
        output_path: outputs/validation_invalid_report.json
      expected_success: true
      expected_output_contains: '"valid": false'
      expected_files:
        - path: outputs/validation_invalid_report.json
          should_exist: true
      tags: [smoke]
