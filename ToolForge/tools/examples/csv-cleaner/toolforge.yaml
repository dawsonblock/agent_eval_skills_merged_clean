name: CSV Cleaner
slug: csv-cleaner
version: "0.1.0"
description: Cleans CSV files by normalizing headers, trimming cells, removing empty rows, and writing a cleaned CSV.
long_description: |
  csv-cleaner reads a CSV file from disk, normalizes headers, trims whitespace
  in every cell, removes fully empty rows, and writes the cleaned CSV to an
  output path.
tags: [csv, file, clean, deduplicate, text]
author: ToolForge
language: python
entry_point: tool.py
dependencies:
  - "python>=3.12"
parameters:
  - name: input_path
    type: string
    description: Path to the input CSV file inside the allowed workspace.
    required: true
  - name: output_path
    type: string
    description: Optional path to write the cleaned CSV.
    required: false
output:
  type: object
  description: JSON summary describing the cleaned CSV artifact.
security:
  requires_filesystem: true
  requires_network: false
  allowed_read_paths:
    - ./examples/**
    - ./inputs/**
  allowed_write_paths:
    - ./outputs/**
  allowed_extensions:
    - .csv
  max_file_size_mb: 50
  max_memory_mb: 256
sandbox_level: 1
mcp:
  enabled: true
  transport: stdio
skill:
  enabled: true
  category: pdf-and-documents
eval:
  enabled: true
  baseline_pass_rate: 0.9
  criteria:
    - name: no_error
      type: no_error
      description: Tool runs without errors
      weight: 1.0
    - name: output_contains_csv
      type: contains
      description: Output contains the cleaned_path field
      weight: 0.5
  cases:
    - id: case-01-success
      description: Basic smoke test with tiny CSV
      inputs:
        input_path: examples/input.csv
      expected_success: true
      expected_output_contains: cleaned_path
      expected_files:
        - path: outputs/cleaned.csv
          should_exist: true
      tags: [smoke]

    - id: case-02-invalid-input
      description: Invalid CSV file (should fail gracefully)
      inputs:
        input_path: examples/missing.csv
      expected_success: false
      expected_error_contains: not found
      tags: [invalid-input, expected-failure]

    - id: case-03-safety-boundary
      description: Path traversal attempt (should be blocked)
      inputs:
        input_path: ../../../etc/passwd
      expected_success: false
      expected_error_contains: Path validation failed
      tags: [safety-boundary, expected-failure]

    - id: case-04-empty-file
      description: Empty CSV file
      inputs:
        input_path: examples/empty.csv
        output_path: outputs/empty_cleaned.csv
      expected_success: true
      expected_files:
        - path: outputs/empty_cleaned.csv
          should_exist: true
      tags: [empty-file]
