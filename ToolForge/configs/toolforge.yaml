# ToolForge configuration
version: "0.1.0"

# Default sandbox level for tool execution
# 0=none, 1=env-isolation, 2=subprocess-timeout+env, 3=docker+network, 4=docker+no-network
sandbox_default_level: 2

# Timeout for tool execution (seconds)
execution_timeout_seconds: 60

# ToolForge workspace configuration

# Paths (relative to workspace root)
paths:
  tools: tools/generated
  skills: skills/generated
  evals: evals/generated
  dist: dist

# AI configuration
ai:
  spec_generator:
    provider: rule_based  # rule_based | openai | anthropic | ollama | azure_openai
    model: null  # Override default model (e.g., gpt-4o, claude-3-haiku, llama3)
    timeout_seconds: 30
    max_retries: 3
    retry_backoff_seconds: 1
    fallback_to_rule_based: true
    interactive: false
    ollama_base_url: "http://localhost:11434"
    azure_openai:
      endpoint: null  # Azure OpenAI endpoint URL
      deployment: null  # Azure OpenAI deployment name
      api_version: "2024-02-15-preview"

# Registry
registry_path: toolforge_registry.json

# Template directory
templates_dir: "packages/templates"

# Output directories
tools_generated_dir: "tools/generated"
skills_generated_dir: "skills/generated"
evals_generated_dir: "evals/generated"
runs_dir: "runs"
dist_dir: "dist"

# Default language for new tools
default_tool_language: "python"

# Whether to require explicit approval before running tools in sandbox level >= 3
require_confirmation_level: 3
