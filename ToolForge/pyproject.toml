[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[project]
name = "toolforge"
version = "0.1.0"
description = "ToolForge — a CLI-first platform for building, testing, packaging, and evaluating AI tools, MCP servers, agent skills, and workflow automations"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "ToolForge Contributors" }]
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "eval_type_backport>=0.2",
    "jinja2>=3.1",
    "ruamel.yaml>=0.18",
    "jsonschema>=4.23",
    "rich>=13.7",
    "termcolor>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-json-report>=1.5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
llm = ["openai>=1.30", "anthropic>=0.28"]

[project.scripts]
toolforge = "toolforge_cli.main:main"
skillforge = "skillforge_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["toolforge", "apps/cli/toolforge_cli", "apps/cli/skillforge_cli", "packages", "skillforge_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120
timeout_method = "thread"
addopts = [
    "-p",
    "no:ddtrace",
    "-p",
    "no:ddtrace.pytest_bdd",
    "-p",
    "no:ddtrace.pytest_benchmark",
]

markers = [
    "integration: tests that spawn subprocesses or run nested pytest",
    "slow: tests that may take longer than normal unit tests"
]

[tool.coverage.run]
branch = true
source = ["packages", "apps"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
exclude = "^(tests/|tools/(examples|generated)/.*/(tool\\.py|tests/.*\\.py)$)"

[tool.ruff]
line-length = 100
target-version = "py312"
